services:
  - type: web
    name: academix-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: academix-db
          property: connectionString
      - key: USE_SQLITE_FALLBACK
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "academix651@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "uzgn axgt yxpf mvvv"
      - key: DEFAULT_FROM_EMAIL
        value: "ACADEMIX <academix651@gmail.com>"

databases:
  - name: academix-db
    databaseName: academix_db
    user: academix_user
    plan: free
