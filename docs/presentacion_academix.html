    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }

    @media (max-width: 900px) {

    @media (max-width: 768px) {

    let currentSlideIndex = 0;
    let filteredIndices = slidesData.map((_, i) => i);
    let activeFilter = "all";
    let isNotesOpen = false;

    // DOM ELEMENTS
    const slideContent = document.getElementById('slide-content');
    const speakerBadge = document.getElementById('speaker-badge');
    const docRefPill = document.getElementById('doc-ref-pill');
    const speechText = document.getElementById('speech-text');
    const speakerNotesDrawer = document.getElementById('speaker-notes');
    const slideCounter = document.getElementById('slide-counter');
    const progressBar = document.getElementById('progress-bar');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const toggleNotesBtn = document.getElementById('toggle-notes-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderSlide(index) {
      if (index < 0 || index >= filteredIndices.length) return;
      currentSlideIndex = index;
      const actualIndex = filteredIndices[index];
      const data = slidesData[actualIndex];

      // Update badge & pill
      speakerBadge.textContent = data.badgeText;
      speakerBadge.className = `speaker-badge ${data.badgeClass}`;
      docRefPill.textContent = `📄 Ref: ${data.docRef}`;

      // Update Content
      slideContent.innerHTML = `
        <div class="slide-title-area">
          <h2>${data.title}</h2>
          <p class="subtitle">${data.subtitle}</p>
        </div>
        ${data.content}
      `;

      // Update Speech
      speechText.textContent = data.speech;

      // Update Progress and Counter
      if (activeFilter === 'all') {
        slideCounter.textContent = `Diapositiva ${actualIndex + 1} / ${slidesData.length}`;
      } else {
        slideCounter.textContent = `Diapositiva ${actualIndex + 1} / ${slidesData.length} (Sección: ${currentSlideIndex + 1} de ${filteredIndices.length})`;
      }
      const progressPercent = ((actualIndex + 1) / slidesData.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Update Nav Buttons
      prevBtn.disabled = (currentSlideIndex === 0);
      nextBtn.disabled = (currentSlideIndex === filteredIndices.length - 1);
    }

    // STRICT FILTER HANDLERS (Cada tema muestra ÚNICAMENTE lo que le pertenece)
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const target = btn.getAttribute('data-target');
        activeFilter = target;

        if (target === 'all') {
          filteredIndices = slidesData.map((_, i) => i);
        } else {
          // FILTRO ESTRICTO: NO INCLUIR APERTURA NI OTRAS DIAPOSITIVAS EN LOS TEMAS INDIVIDUALES
          filteredIndices = [];
          slidesData.forEach((s, idx) => {
            if (s.speaker === target) {
              filteredIndices.push(idx);
            }
          });
        }
        renderSlide(0);
      });
    });

    // NAVIGATION
    function nextSlide() {
      if (currentSlideIndex < filteredIndices.length - 1) {
        renderSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    nextBtn.addEventListener('click', nextSlide);
    prevBtn.addEventListener('click', prevSlide);

    // KEYBOARD NAVIGATION
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'n') {
        toggleNotes();
      }
    });

    // TOGGLE NOTES
    function toggleNotes() {
      isNotesOpen = !isNotesOpen;
      if (isNotesOpen) {
        speakerNotesDrawer.classList.add('open');
        toggleNotesBtn.style.background = '#e0e7ff';
        toggleNotesBtn.style.borderColor = '#6366f1';
        toggleNotesBtn.style.color = '#1e3a8a';
      } else {
        speakerNotesDrawer.classList.remove('open');
        toggleNotesBtn.style.background = '';
        toggleNotesBtn.style.borderColor = '';
        toggleNotesBtn.style.color = '';
      }
    }
    toggleNotesBtn.addEventListener('click', toggleNotes);

    // FULLSCREEN
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(`Error de pantalla completa: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    });

    // INIT
    renderSlide(0);
  </script>
